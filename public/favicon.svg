<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="22" fill="#0d5c35"/>
  <!-- Diamond facets matching the logo -->
  <!-- Top-left facet (light) -->
  <polygon points="50,15 22,50 50,50" fill="#a7d3bc"/>
  <!-- Top-right facet (medium) -->
  <polygon points="50,15 78,50 50,50" fill="#137a4a"/>
  <!-- Bottom-left facet (medium-dark) -->
  <polygon points="22,50 50,85 50,50" fill="#137a4a"/>
  <!-- Bottom-right facet (darkest) -->
  <polygon points="78,50 50,85 50,50" fill="#0d5c35"/>
</svg>
